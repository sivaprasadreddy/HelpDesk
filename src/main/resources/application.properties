spring.application.name=helpdesk
spring.config.import=optional:file:.env.properties
spring.docker.compose.lifecycle-management=start_only

#### App ####

#### Spring MVC ####
server.compression.enabled=true
server.http2.enabled=true
spring.threads.virtual.enabled=true

#### Shadleaf ####
shadleaf.skin=sketch

###### Logging ######
jdbc.datasource-proxy.query.enable-logging=true
jdbc.datasource-proxy.query.logger-name=helpdesk.query-logger
jdbc.datasource-proxy.query.log-level=DEBUG
jdbc.datasource-proxy.multiline=false
logging.level.helpdesk.query-logger=DEBUG

#### Actuator ####
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.tracing.export.enabled=${TRACING_ENABLED:false}
management.otlp.metrics.export.url=${METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${TRACES_EXPORT_URL:http://localhost:4318/v1/traces}
management.opentelemetry.logging.export.otlp.endpoint=${LOGS_EXPORT_URL:http://localhost:4318/v1/logs}

#### Database ####
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.auto-commit=false
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.data.jpa.repositories.bootstrap-mode=deferred
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false
#spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.properties.hibernate.id.optimizer.pooled.preferred=pooled-lo
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.flyway.locations=classpath:/db/migration

#### Spring Modulith ####
spring.modulith.events.jdbc.schema-initialization.enabled=true
spring.modulith.events.completion-mode=update
spring.modulith.events.republish-outstanding-events-on-restart=true

#### Email ####
spring.mail.host=${EMAIL_HOST:127.0.0.1}
spring.mail.port=${EMAIL_PORT:1025}
spring.mail.protocol=smtp
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_TLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

#### RabbitMQ ####
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

#### Spring AI ####
# Active chat model provider: ollama, openai
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:ollama}
spring.ai.ollama.base-url=${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_CHAT_MODEL:llama3.2}
spring.ai.openai.api-key=${OPENAI_API_KEY:your-openai-api-key}

#### BootUI ####
bootui.enabled=${BOOTUI_ENABLED:off}
bootui.mcp.enabled=${BOOTUI_MCP_ENABLED:off}
