<html xmlns:th="http://www.thymeleaf.org" xmlns:sl="https://shadleaf.dev/sl"
      th:replace="~{layout/main :: layout(${categoryId == null ? 'Add Category' : 'Edit Category'}, ~{::breadcrumb}, ~{::#page-content})}">
<body>
<th:block th:ref="breadcrumb">
    <sl:breadcrumb-item><sl:breadcrumb-link th:href="@{/home}">Home</sl:breadcrumb-link></sl:breadcrumb-item>
    <sl:breadcrumb-separator/>
    <sl:breadcrumb-item><sl:breadcrumb-link th:href="@{/admin/categories}">Categories</sl:breadcrumb-link></sl:breadcrumb-item>
    <sl:breadcrumb-separator/>
    <sl:breadcrumb-item><sl:breadcrumb-page th:text="${categoryId == null ? 'Add' : 'Edit'}">Add</sl:breadcrumb-page></sl:breadcrumb-item>
</th:block>
<div id="page-content" class="form-card">
    <sl:card>
        <sl:card-content>
            <form th:object="${category}"
                  th:action="${categoryId == null} ? @{/admin/categories} : @{/admin/categories/{id}(id=${categoryId})}"
                  method="post" novalidate class="form-stack">
                <sl:form-errors/>
                <sl:field th:field="*{name}">
                    <sl:field-label>Name</sl:field-label>
                    <sl:input autocomplete="off"/>
                    <sl:field-error/>
                </sl:field>
                <sl:field th:field="*{description}">
                    <sl:field-label>Description</sl:field-label>
                    <sl:textarea rows="3"/>
                    <sl:field-error/>
                </sl:field>
                <div class="toolbar">
                    <sl:button as="a" th:href="@{/admin/categories}" variant="outline">Cancel</sl:button>
                    <sl:button type="submit" th:text="${categoryId == null ? 'Create Category' : 'Save Changes'}">Save</sl:button>
                </div>
            </form>
        </sl:card-content>
    </sl:card>
</div>
</body>
</html>
