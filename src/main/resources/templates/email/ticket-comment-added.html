<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/layout :: layout(~{::h1}, ~{::#content})}">
<body>
<h1 style="margin:0 0 16px;font-size:18px;line-height:1.4;" th:text="|New comment on ticket #${ticket.id}|">New comment on ticket #1</h1>
<div id="content">
    <p style="margin:0 0 8px;font-size:14px;line-height:1.6;">
        <strong th:text="${actorName ?: 'Someone'}">Priya Nair</strong> commented:
    </p>
    <blockquote style="margin:0;padding:12px 16px;background:#f4f4f5;border-left:3px solid #d4d4d8;font-size:14px;line-height:1.6;white-space:pre-line;"
                th:text="${comment}">Any update?</blockquote>
</div>
</body>
</html>
