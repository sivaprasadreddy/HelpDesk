<html xmlns:th="http://www.thymeleaf.org" xmlns:sl="https://shadleaf.dev/sl"
      th:replace="~{layout/public :: layout('Access Denied', ~{::#page-content})}">
<body>
<div id="page-content">
    <sl:empty>
        <sl:empty-header>
            <sl:empty-media variant="icon"><sl:icon name="shield-alert"/></sl:empty-media>
            <sl:empty-title level="1">403 - Access Denied</sl:empty-title>
            <sl:empty-description>You do not have permission to access this resource.</sl:empty-description>
        </sl:empty-header>
        <sl:empty-content>
            <sl:button as="a" th:href="@{/}">
                <sl:slot name="icon-start"><sl:icon name="house"/></sl:slot>
                Go to Homepage
            </sl:button>
        </sl:empty-content>
    </sl:empty>
</div>
</body>
</html>
