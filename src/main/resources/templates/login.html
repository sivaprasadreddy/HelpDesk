<html xmlns:th="http://www.thymeleaf.org" xmlns:sl="https://shadleaf.dev/sl"
      th:replace="~{layout/public :: layout('Login', ~{::#page-content})}">
<body>
<div id="page-content" class="auth-card">
    <sl:card>
        <sl:card-header>
            <sl:card-title level="1">Welcome back</sl:card-title>
            <sl:card-description>Sign in to your account.</sl:card-description>
        </sl:card-header>
        <sl:card-content>
            <sl:alert th:if="${param.error}" variant="destructive" role="alert" class="flash">
                <sl:icon name="circle-alert"/>
                <sl:alert-title>Invalid email or password.</sl:alert-title>
            </sl:alert>
            <sl:alert th:if="${successMessage}" role="status" class="flash">
                <sl:icon name="circle-check"/>
                <sl:alert-title th:text="${successMessage}">Success</sl:alert-title>
            </sl:alert>
            <sl:alert th:if="${param.logout}" role="status" class="flash">
                <sl:icon name="circle-check"/>
                <sl:alert-title>You have been logged out.</sl:alert-title>
            </sl:alert>
            <form id="loginForm" method="post" th:action="@{/login}" class="form-stack">
                <sl:field for="username">
                    <sl:field-label>Email</sl:field-label>
                    <sl:input type="email" name="username" required autocomplete="email" placeholder="you@example.com"/>
                </sl:field>
                <sl:field for="password">
                    <sl:field-label>Password</sl:field-label>
                    <sl:input type="password" name="password" required autocomplete="current-password"/>
                </sl:field>
                <sl:button type="submit">
                    <sl:slot name="icon-start"><sl:icon name="log-in"/></sl:slot>
                    Sign in
                </sl:button>
            </form>
        </sl:card-content>
    </sl:card>
</div>
</body>
</html>
