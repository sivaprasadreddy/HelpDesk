<html xmlns:th="http://www.thymeleaf.org" xmlns:sl="https://shadleaf.dev/sl"
      th:replace="~{layout/main :: layout('Staff', ~{::breadcrumb}, ~{::#page-content})}">
<body>
<th:block th:ref="breadcrumb">
    <sl:breadcrumb-item><sl:breadcrumb-link th:href="@{/home}">Home</sl:breadcrumb-link></sl:breadcrumb-item>
    <sl:breadcrumb-separator/>
    <sl:breadcrumb-item><sl:breadcrumb-page>Staff</sl:breadcrumb-page></sl:breadcrumb-item>
</th:block>
<div id="page-content" class="stack">
    <div class="toolbar">
        <sl:button as="a" th:href="@{/admin/staff/new}">
            <sl:slot name="icon-start"><sl:icon name="plus"/></sl:slot>
            <span>Add Staff member</span>
        </sl:button>
    </div>
    <sl:table th:unless="${staffMembers.isEmpty()}">
        <thead>
        <tr>
            <th>Name</th><th>Email</th>
            <th>Mobile</th>
            <th>Categories</th>
            <th>Status</th><th>Created</th>
            <sl:table-head align="end">Actions</sl:table-head>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${staffMembers}">
            <td th:text="${u.name}">Jane Doe</td>
            <td th:text="${u.email}">jane@example.com</td>
            <td th:text="${u.mobile ?: '-'}">9876543210</td>
            <td>
                <div class="badge-list">
                    <th:block th:each="cid : ${u.categoryIds}" th:with="catName=${categoryNames.get(cid)}"><sl:badge variant="outline">[[${catName}]]</sl:badge></th:block>
                    <span th:if="${u.categoryIds.isEmpty()}" class="muted">None</span>
                </div>
            </td>
            <td>
                <sl:badge th:if="${u.active}" variant="secondary">Active</sl:badge>
                <sl:badge th:unless="${u.active}" variant="outline">Inactive</sl:badge>
            </td>
            <td th:text="${#temporals.format(u.createdAt, 'dd MMM yyyy', T(java.time.ZoneId).systemDefault())}">01 Jan 2026</td>
            <td data-align="end">
                <div class="row-actions">
                    <sl:button as="a" th:href="@{/admin/staff/{id}/edit(id=${u.id})}" variant="outline" size="sm">Edit</sl:button>
                    <form th:if="${u.active}" method="post" th:action="@{/admin/staff/{id}/deactivate(id=${u.id})}">
                        <sl:button type="submit" variant="destructive" size="sm">Deactivate</sl:button>
                    </form>
                    <form th:unless="${u.active}" method="post" th:action="@{/admin/staff/{id}/activate(id=${u.id})}">
                        <sl:button type="submit" variant="secondary" size="sm">Activate</sl:button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </sl:table>
    <sl:empty th:if="${staffMembers.isEmpty()}">
        <sl:empty-header>
            <sl:empty-media variant="icon"><sl:icon name="users"/></sl:empty-media>
            <sl:empty-title level="2">No staff yet</sl:empty-title>
        </sl:empty-header>
    </sl:empty>
</div>
</body>
</html>
