<html xmlns:th="http://www.thymeleaf.org" xmlns:sl="https://shadleaf.dev/sl"
      th:replace="~{layout/main :: layout(|Edit Ticket #${ticket.id}|, ~{::breadcrumb}, ~{::#page-content})}">
<body>
<th:block th:ref="breadcrumb">
    <sl:breadcrumb-item><sl:breadcrumb-link th:href="@{/home}">Home</sl:breadcrumb-link></sl:breadcrumb-item>
    <sl:breadcrumb-separator/>
    <sl:breadcrumb-item><sl:breadcrumb-link th:href="@{/tickets}">All Tickets</sl:breadcrumb-link></sl:breadcrumb-item>
    <sl:breadcrumb-separator/>
    <sl:breadcrumb-item><sl:breadcrumb-link th:href="@{/tickets/{id}(id=${ticket.id})}" th:text="|Ticket #${ticket.id}|">Ticket #100</sl:breadcrumb-link></sl:breadcrumb-item>
    <sl:breadcrumb-separator/>
    <sl:breadcrumb-item><sl:breadcrumb-page>Edit</sl:breadcrumb-page></sl:breadcrumb-item>
</th:block>
<div id="page-content" class="form-card">
    <sl:card>
        <sl:card-content>
            <form th:object="${form}" th:action="@{/tickets/{id}/edit(id=${ticket.id})}" method="post" novalidate class="form-stack">
                <sl:form-errors/>
                <sl:field th:field="*{title}">
                    <sl:field-label>Title</sl:field-label>
                    <sl:input autocomplete="off"/>
                    <sl:field-error/>
                </sl:field>
                <sl:field th:field="*{categoryId}">
                    <sl:field-label>Category</sl:field-label>
                    <sl:native-select class="full-width">
                        <option th:each="c : ${categories}" th:value="${c.id}"
                                th:text="${c.active ? c.name : c.name + ' (inactive)'}">Plumbing</option>
                    </sl:native-select>
                    <sl:field-error/>
                </sl:field>
                <sl:field th:field="*{priority}">
                    <sl:field-label>Priority</sl:field-label>
                    <sl:native-select class="full-width">
                        <option th:each="p : ${priorities}" th:value="${p}" th:text="${p.label}">Medium</option>
                    </sl:native-select>
                    <sl:field-error/>
                </sl:field>
                <sl:field th:field="*{description}">
                    <sl:field-label>Description</sl:field-label>
                    <sl:textarea rows="5"/>
                    <sl:field-error/>
                </sl:field>
                <div class="toolbar">
                    <sl:button as="a" th:href="@{/tickets/{id}(id=${ticket.id})}" variant="outline">Cancel</sl:button>
                    <sl:button type="submit">Save Changes</sl:button>
                </div>
            </form>
        </sl:card-content>
    </sl:card>
</div>
</body>
</html>
